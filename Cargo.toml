[package]
name = "rex-omnidiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Content-aware AST & Kitty-graphics Git diff, hunk-staging, and AI code-review module for Rex, powered by OmniDiff"
license = "MIT"
repository = "https://github.com/verte21/rex-omnidiff"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
